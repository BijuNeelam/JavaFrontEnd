apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-frontend
  template:
    metadata:
      labels:
        app: java-frontend
    spec:
      containers:
        - name: java-frontend
          image: bneelam/java-frontend:v1
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: java-frontend-service
spec:
  type: NodePort
  selector:
    app: java-frontend
  ports:
    - port: 80
      targetPort: 8080